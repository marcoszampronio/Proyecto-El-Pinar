# Backup automático diario de reservas
# Corre todos los días a las 3:00 AM (hora Argentina = UTC-3)
# Para activarlo necesitás configurar los secrets en GitHub:
#   BACKEND_URL → URL pública de tu backend (ej: https://tu-backend.railway.app)
#   ADMIN_TOKEN → Token de un usuario admin de Supabase (generalo desde
#                 Supabase Dashboard → Authentication → Users → tu usuario → Generate token)
#   GDRIVE_FOLDER_ID → ID de la carpeta de Google Drive donde guardar los backups
#   GDRIVE_SA_KEY → JSON de la service account de Google Drive (en una sola línea)

name: Backup diario a Google Drive

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 Argentina
  workflow_dispatch:       # tambien permite correrlo manualmente desde GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener datos del backend
        id: fetch
        run: |
          FECHA=$(date +%Y-%m-%d)
          curl -s \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            "${{ secrets.BACKEND_URL }}/api/admin/export/backup-gdrive" \
            -o "backup-$FECHA.json"
          echo "FECHA=$FECHA" >> $GITHUB_ENV
          echo "Backup generado para $FECHA"
          cat "backup-$FECHA.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Total reservas: {d[\"totalReservas\"]}')"

      - name: Subir a Google Drive
        uses: satackey/action-google-drive@v1
        with:
          skicka-tokencache-json: ${{ secrets.GDRIVE_SA_KEY }}
          upload-from: ./backup-${{ env.FECHA }}.json
          upload-to: /backups-complejo/backup-${{ env.FECHA }}.json
          google-account-email: backup-service@tu-proyecto.iam.gserviceaccount.com
