name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend - instalar y chequear sintaxis
        working-directory: backend
        run: |
          npm install
          node --check server.js
          for f in routes/*.js lib/*.js middleware/*.js; do node --check "$f"; done

      - name: Frontend - build
        working-directory: frontend
        run: |
          npm install
          npm run build
