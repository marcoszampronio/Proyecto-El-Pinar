<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'DMSerif'; src: url('vendor/fonts/DMSerifDisplay-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Satoshi'; font-weight: 400; src: url('vendor/fonts/Satoshi-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Satoshi'; font-weight: 500; src: url('vendor/fonts/Satoshi-Medium.woff2') format('woff2'); }
      @font-face { font-family: 'Satoshi'; font-weight: 700; src: url('vendor/fonts/Satoshi-Bold.woff2') format('woff2'); }

      :root { --navy: #0F2436; --marino: #1D3E5A; --oro: #F2C14E; --crema: #F3EEE1; --crema2: #FBF7EE; --verde: #5BAE6B; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--crema); font-family: 'Satoshi', sans-serif; }
      #root {
        width: 100%; height: 100%; position: relative; overflow: hidden; background-color: var(--crema);
        background-image:
          linear-gradient(rgba(15,36,54,0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15,36,54,0.055) 1px, transparent 1px);
        background-size: 54px 54px;
      }
      .grain {
        position: absolute; inset: -2%; z-index: 50; pointer-events: none;
        background-image: url('assets/grain.png'); background-repeat: repeat; background-size: 256px 256px;
        opacity: 0.045; mix-blend-mode: overlay;
      }

      /* titulares */
      .h { font-weight: 700; color: var(--navy); letter-spacing: -0.025em; line-height: 1.08; }
      .kw {
        display: inline-block; background: var(--oro); border: 5px solid var(--navy); border-radius: 18px;
        padding: 0 22px 6px; transform: rotate(-1.6deg); box-shadow: 7px 7px 0 var(--navy);
      }

      /* intro */
      #intro { position: absolute; inset: 0; z-index: 5; }
      #intro .box { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; }
      #intro .h { font-size: 118px; }
      .eyebrow { font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--marino); font-size: 24px; }

      /* titulares de paso */
      .cap { position: absolute; left: 0; right: 0; top: 112px; text-align: center; padding: 0 60px; opacity: 0; z-index: 6; }
      .cap .h { font-size: 96px; }
      .sticker {
        position: absolute; z-index: 9; background: var(--navy); color: var(--crema); font-weight: 700; font-size: 34px; letter-spacing: 0.12em;
        padding: 14px 28px; border-radius: 14px; box-shadow: 6px 6px 0 var(--oro); opacity: 0; left: 120px; top: 392px; transform: rotate(-6deg);
      }
      .sticker b { color: var(--oro); }

      /* celular */
      #phone {
        position: absolute; left: 196px; top: 450px; width: 688px; height: 1418px; z-index: 4;
        background: var(--navy); border-radius: 84px; box-shadow: 18px 18px 0 var(--oro), 0 0 0 3px var(--navy);
      }
      #screen { position: absolute; left: 14px; top: 14px; width: 660px; height: 1390px; border-radius: 70px; overflow: hidden; background: #0F2436; }
      #status { position: absolute; left: 0; top: 0; width: 660px; height: 40px; z-index: 5; background: #0F2436; color: #F3EEE1; font-weight: 700; font-size: 20px; }
      #status .t { position: absolute; left: 58px; top: 9px; }
      #status .r { position: absolute; right: 52px; top: 12px; display: flex; gap: 8px; align-items: center; }
      #status .bat { width: 32px; height: 15px; border: 2px solid #F3EEE1; border-radius: 5px; padding: 1.5px; }
      #status .bat i { display: block; width: 75%; height: 100%; background: #F3EEE1; border-radius: 2px; }
      #island { position: absolute; left: 50%; top: 9px; width: 120px; height: 30px; margin-left: -60px; background: #000; border-radius: 20px; z-index: 6; }
      #pov { position: absolute; left: 0; top: 40px; width: 660px; height: 1350px; }

      /* cierre */
      #outro { position: absolute; inset: 0; z-index: 8; opacity: 0; }
      #outro .box { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 60px; }
      #outro .h { font-size: 128px; }
      .marca { display: flex; align-items: center; gap: 22px; margin-top: 80px; }
      .marca svg { width: 62px; height: 80px; color: var(--navy); }
      .marca span { font-family: 'DMSerif', Georgia, serif; font-size: 82px; color: var(--navy); }
      .cta {
        margin-top: 56px; background: var(--oro); color: var(--navy); border: 5px solid var(--navy); border-radius: 999px; font-weight: 700; font-size: 46px;
        padding: 26px 64px; box-shadow: 9px 9px 0 var(--navy);
      }
      .sub { margin-top: 44px; font-weight: 500; font-size: 32px; color: var(--marino); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="pov" data-start="0" data-duration="29" data-width="1080" data-height="1920">

      <!-- intro -->
      <div id="intro" class="clip" data-start="0" data-duration="2.8" data-track-index="0">
        <div class="box">
          <div id="i-eyb" class="eyebrow">Complejo El Pinar · Paraná</div>
          <div id="i-t" class="h" style="margin-top:34px;">Así se reserva<br/>una cancha<br/><span id="i-kw" class="kw">en El Pinar</span></div>
        </div>
      </div>

      <!-- pasos -->
      <div id="c1" class="cap"><div class="h">Entrá y bajá<br/>hasta <span class="kw">Reservar</span></div></div>
      <div id="c2" class="cap"><div class="h">Elegí <span class="kw">día</span><br/>y horario</div></div>
      <div id="c3" class="cap"><div class="h">Completá<br/>tus <span class="kw">datos</span></div></div>
      <div id="c4" class="cap"><div class="h">Enviá por<br/><span class="kw">WhatsApp</span></div></div>
      <div id="s1" class="sticker">PASO <b>1</b></div>
      <div id="s2" class="sticker">PASO <b>2</b></div>
      <div id="s3" class="sticker">PASO <b>3</b></div>
      <div id="s4" class="sticker">PASO <b>4</b></div>

      <!-- celular -->
      <div id="phone">
        <div id="screen">
          <video id="povv" src="assets/pov.mp4" style="position:absolute;left:0;top:40px;width:660px;height:1350px" data-start="2.6" data-duration="21.23" data-track-index="2" muted playsinline></video>
          <div id="status"><span class="t">9:41</span>
            <span class="r">
              <svg width="30" height="18" viewBox="0 0 30 18" fill="#F3EEE1"><rect x="0" y="12" width="5" height="6" rx="1"/><rect x="8" y="8" width="5" height="10" rx="1"/><rect x="16" y="4" width="5" height="14" rx="1"/><rect x="24" y="0" width="5" height="18" rx="1"/></svg>
              <span class="bat"><i></i></span>
            </span>
          </div>
          <div id="island"></div>
        </div>
      </div>

      <!-- cierre -->
      <div id="outro">
        <div class="box">
          <div id="o-t" class="h">Mirá qué<br/><span class="kw">fácil</span> que es.</div>
          <div id="o-marca" class="marca">
            <svg viewBox="0 0 40 52"><path d="M20 2 L28 16 L23.5 16 L31 30 L26 30 L34 44 L6 44 L14 30 L9 30 L16.5 16 L12 16 Z" fill="currentColor"/><rect x="17.6" y="43" width="4.8" height="9" fill="currentColor"/></svg>
            <span>El Pinar</span>
          </div>
          <div id="o-cta" class="cta">Reservá tu cancha</div>
          <div id="o-sub" class="sub">Link en la bio</div>
        </div>
      </div>

      <div class="grain"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' };

      // intro
      gsap.set('#i-eyb', { opacity: 0, y: 20 });
      gsap.set('#i-t', { opacity: 0, y: 40 });
      tl.to('#i-eyb', { ...IN }, 0.1);
      tl.to('#i-t', { ...IN, duration: 0.7 }, 0.25);
      tl.from('#i-kw', { rotation: -8, scale: 0.8, duration: 0.5, ease: 'back.out(2)' }, 0.8);
      tl.to('#intro', { opacity: 0, y: -50, duration: 0.45, ease: 'power2.in' }, 2.35);

      // celular entra
      gsap.set('#phone', { y: 1500 });
      tl.to('#phone', { y: 0, duration: 0.9, ease: 'power3.out' }, 2.1);

      // pasos: [id, entra, sale]
      const pasos = [['1', 2.9, 9.9], ['2', 9.9, 14.6], ['3', 14.6, 22.2], ['4', 22.2, 24.0]];
      pasos.forEach(([n, a, b]) => {
        gsap.set('#c' + n, { opacity: 0, y: 30 });
        gsap.set('#s' + n, { opacity: 0, scale: 0.6 });
        tl.to('#c' + n, { ...IN }, a);
        tl.to('#s' + n, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, a + 0.2);
        tl.to('#c' + n, { opacity: 0, y: -24, duration: 0.3, ease: 'power2.in' }, b - 0.3);
        tl.to('#s' + n, { opacity: 0, scale: 0.8, duration: 0.25, ease: 'power2.in' }, b - 0.3);
      });

      // cierre
      gsap.set('#outro', { opacity: 0 });
      gsap.set(['#o-t', '#o-marca', '#o-cta', '#o-sub'], { opacity: 0, y: 30 });
      tl.to('#phone', { y: 1500, duration: 0.7, ease: 'power2.in' }, 24.0);
      tl.to('#outro', { opacity: 1, duration: 0.01 }, 24.3);
      tl.to('#o-t', { ...IN, duration: 0.7 }, 24.6);
      tl.from('#o-t .kw', { rotation: -9, scale: 0.8, duration: 0.5, ease: 'back.out(2)' }, 25.1);
      tl.to('#o-marca', { ...IN }, 25.6);
      tl.to('#o-cta', { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.8)' }, 26.0);
      tl.to('#o-sub', { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 26.5);

      window.__timelines['pov'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
