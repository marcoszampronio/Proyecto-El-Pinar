# Configuración de deploy en Netlify (frontend).
# Está en la raíz del repo para que Netlify lo detecte solo: al conectar el
# repo no hace falta configurar build ni publish a mano.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: cualquier ruta (ej /panel) sirve index.html y React Router se encarga.
# (también está frontend/public/_redirects como respaldo)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
